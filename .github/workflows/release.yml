name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  promote-and-deploy:
    name: Promote tested image and deploy to test env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the already-built image to the version tag (no rebuild)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:sha-${{ github.sha }}"

      - name: Deploy to test environment
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          export APP_IMAGE="${IMAGE}:${APP_VERSION}"
          bash scripts/deploy.sh
