name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to roll back to (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Roll back to ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image exists
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}"

      - name: Deploy the previous version
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          APP_VERSION: ${{ inputs.version }}
        run: bash scripts/rollback.sh
