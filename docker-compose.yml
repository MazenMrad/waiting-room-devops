name: waiting-room

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waiting
      POSTGRES_PASSWORD: waiting
      POSTGRES_DB: waiting_room
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waiting -d waiting_room"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    image: ${APP_IMAGE:-waiting-room:local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://waiting:waiting@db:5432/waiting_room
      APP_VERSION: ${APP_VERSION:-local}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
